version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: scr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: contract_review
      MYSQL_USER: scr_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "scr_user", "-p${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - scr-network

  redis:
    image: redis:7-alpine
    container_name: scr-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - scr-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: scr-chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'nanosecond' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - scr-network

  fastapi:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: scr-fastapi
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      # ChromaDB
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      # LLM
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: deepseek-chat
      EMBEDDING_MODEL: /app/embedding_model
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      LOG_LEVEL: INFO
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: scr_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_DATABASE: contract_review
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # JWT
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION_MS: "3600000"
      # Upload
      UPLOAD_DIR: /app/uploads
      LANGGRAPH_CHECKPOINT_PATH: /app/checkpoints/checkpoints.sqlite
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
      - checkpoint_data:/app/checkpoints
      - scr_embedding_model:/app/embedding_model
    networks:
      - scr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scr-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - fastapi
    networks:
      - scr-network

volumes:
  mysql_data:
  redis_data:
  chroma_data:
  upload_data:
  checkpoint_data:
  scr_embedding_model:
    external: true

networks:
  scr-network:
    driver: bridge
